<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<title>{titulo} - {titulo_secao}</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<link rel="icon" type="image/png" href="/favicon.png">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
		<link rel="manifest" href="/manifest.json">
		<link rel="stylesheet" href="/style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
		<link rel="canonical" href="https://leonardo.stuker.nom.br/{url_path}">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="{descricao}">
		<meta name="author" content="Leonardo Sander Stüker">
		<meta property="og:title" content="{titulo} - {titulo_secao}">
		<meta property="og:description" content="{descricao}">
		<meta property="og:type" content="article">
		<meta property="og:url" content="https://leonardo.stuker.nom.br/{url_path}">
	</head>
	<body>
		{header}
		<main id="main-content">
			<div class="hero-banner">
				<h2>{titulo_secao}</h2>
			</div>
			<article>
				<h1>{titulo}</h1>
				{texto_corpo}{bloco_carousel}
			</article>
		</main>
		{footer}
		<script src="/scripts.js"></script>
	</body>
</html>
